<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交互式习惯追踪看板 | Habit Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
    }
    .check-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .check-btn:active {
      transform: scale(0.85);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shadow-indigo-200">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">习惯追踪看板</h1>
          <p class="text-xs text-slate-500" id="currentDateDisplay"></p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="resetDemoData()" class="text-xs text-slate-500 hover:text-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition flex items-center gap-1.5">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 重置示例数据
        </button>
        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl shadow-sm shadow-indigo-100 transition flex items-center gap-1.5">
          <i data-lucide="plus" class="w-4 h-4"></i> 新增习惯
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-6">

    <!-- 顶部统计概览卡片 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">今日完成进度</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="statToday">0 / 0</p>
          <p class="text-xs text-emerald-600 font-medium mt-1" id="statTodayRate">完成率 0%</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i data-lucide="target" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">本周总体达成率</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="statWeekRate">0%</p>
          <p class="text-xs text-slate-400 mt-1" id="statWeekTotal">累计打卡 0 次</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <i data-lucide="trending-up" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">最长连续打卡</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="statBestStreak">0 天</p>
          <p class="text-xs text-amber-600 font-medium mt-1" id="statBestHabitName">暂无记录</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center">
          <i data-lucide="flame" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">全勤打卡天数</p>
          <p class="text-2xl font-bold text-slate-900 mt-1" id="statPerfectDays">0 天</p>
          <p class="text-xs text-slate-400 mt-1">本周所有目标全部达成</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center">
          <i data-lucide="award" class="w-6 h-6"></i>
        </div>
      </div>
    </div>

    <!-- 每周习惯打卡矩阵 -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <h2 class="text-base font-bold text-slate-900">本周打卡记录表</h2>
          <p class="text-xs text-slate-500">点击对应日期的圆圈即可完成或取消打卡</p>
        </div>
        <div class="flex items-center space-x-2 text-xs text-slate-500 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200/60">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-600"></i>
          <span id="weekRangeText">本周一 至 本周日</span>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-50/50" id="tableHeaderRow">
              <!-- 动态生成表头 -->
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 text-sm" id="habitTableBody">
            <!-- 动态生成习惯行 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 图表可视化区域 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 折线图：每日完成率趋势 -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-base font-bold text-slate-900">每日目标达成率趋势</h3>
            <p class="text-xs text-slate-500">本周周一至周日整体习惯完成百分比 (%)</p>
          </div>
          <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-600">实时更新</span>
        </div>
        <div class="h-64">
          <canvas id="dailyTrendChart"></canvas>
        </div>
      </div>

      <!-- 柱状图：各习惯完成天数对比 -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-base font-bold text-slate-900">各习惯本周打卡频次与连续性</h3>
            <p class="text-xs text-slate-500">对比不同目标在本周的累计完成天数 (满分 7 天)</p>
          </div>
          <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600">习惯分布</span>
        </div>
        <div class="h-64">
          <canvas id="habitComparisonChart"></canvas>
        </div>
      </div>
    </div>

  </main>

  <!-- 新增习惯模态框 -->
  <div id="habitModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 transform transition-all">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900">添加新习惯目标</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="addHabitForm" onsubmit="handleAddHabit(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1.5">习惯名称</label>
          <input type="text" id="habit
